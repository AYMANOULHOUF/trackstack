name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-service, protocol-gateway]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  docs:
    name: Docs version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_docs.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: trackstack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t trackstack-api backend/api-service
      - name: Build gateway image
        run: docker build -t trackstack-gateway backend/protocol-gateway
      - name: Build web image
        run: docker build -f Dockerfile.caddy -t trackstack-web .
      - name: Write test environment
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=trackproj_test
          JWT_SECRET=test-jwt-secret-for-ci
          ADMIN_EMAIL=admin@trackstack.local
          ADMIN_PASSWORD=test-admin-password
          GATEWAY_SECRET=test-gateway-secret
          EOF
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          docker compose logs --no-color --tail=200
          exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color --tail=200' ERR
          curl -fsS http://localhost:8080/healthz
          echo
          login=$(curl -fsS -X POST http://localhost:8080/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@trackstack.local","password":"test-admin-password"}')
          echo "$login" | grep -q '"access_token"'
          token=$(echo "$login" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          curl -fsS http://localhost:8080/v1/orgs -H "Authorization: Bearer $token" >/dev/null
          org=$(curl -fsS -X POST http://localhost:8080/v1/orgs \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"CI Org","email":"ci@trackstack.local","password":"ci-password-123"}')
          org_id=$(echo "$org" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$org_id"
          device=$(curl -fsS -X POST http://localhost:8080/v1/enroll \
            -H 'Content-Type: application/json' -d '{"name":"CI Phone","type":"phone"}')
          device_id=$(echo "$device" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$device_id"
          curl -fsS -X PUT "http://localhost:8080/v1/devices/$device_id/orgs" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"org_ids\":[\"$org_id\"]}"
          org_login=$(curl -fsS -X POST http://localhost:8080/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@trackstack.local","password":"ci-password-123"}')
          org_token=$(echo "$org_login" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          test -n "$org_token"
          # Trips must authorize through device_orgs, not the legacy devices.org_id column.
          curl -fsS "http://localhost:8080/v1/trips?device_id=$device_id" \
            -H "Authorization: Bearer $org_token" >/dev/null
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
          echo "smoke test passed"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
